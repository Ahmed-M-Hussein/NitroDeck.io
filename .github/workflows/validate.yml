name: Validate packs

on:
  pull_request:
    paths: ['packs/**', 'tools/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every pack
        run: node tools/build-catalog.mjs --validate
