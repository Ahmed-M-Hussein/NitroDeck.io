name: Rebuild catalog

# After a pack is merged, regenerate catalog.json so contributors never have to.
on:
  push:
    branches: [main]
    paths: ['packs/**', 'tools/build-catalog.mjs']

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and rebuild
        run: node tools/build-catalog.mjs
      - name: Commit catalog.json if it changed
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.json
            git commit -m "Rebuild catalog.json"
            git push
          fi
